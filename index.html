<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tool Random Generator</title>
  <style>
    textarea { width: 100%; height: 300px; margin: 10px 0; }
    button { margin: 0px; padding: 6px 6px; }
    .section { display: none; border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    .active { display: block; }
    .sep-select { margin: 5px 0; }
.menu-tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  padding:8px 0;
  scrollbar-width:thin;
  scrollbar-color: #00bbff #add8e6;
  
}


.menu-tabs button{
  flex-shrink:0;
  padding:6px 12px;
  border:none;
  border-radius:6px;
  background:#f1f1f1;
  cursor:pointer;
}


.menu-tabs button:hover{
  background:#ddd;
}

.menu-tabs button.active-tab{
  background:#ff4d4f;
  color:white;
  font-weight:bold;
}
  </style>
</head>
<body>
  <h2>🔢 Generator</h2>

  <label>Bắt đầu kỳ: <input type="number" id="startKy" value="001"></label>
  <label>Số kỳ cần tạo: <input type="number" id="soKy" value="30"></label>
  <br><br>

<label>🔍 Tìm nhanh</label>
<input 
  type="text" 
  id="searchBox" 
  placeholder="Nhập từ khóa..." 
  oninput="searchTool()" 
  onkeydown="handleEnter(event)"
  style="padding:6px;width:220px;">
<br><br>

<button id="toggleMenuBtn" onclick="toggleMenu()">
  Chọn mục ▼
</button>

<div id="menuTabsWrapper" style="display:none;">
  <div id="menuTabs" class="menu-tabs"></div>
</div>

const sectionsDiv = document.getElementById("sections");
const menuTabs = document.getElementById("menuTabs");

for (const key in datasets) {

  const { id, title } = datasets[key];

  // tạo section
  sectionsDiv.innerHTML += `
    <div id="section-${key}" class="section">

      <div style="font-size:20px;font-weight:bold;color:red">
        ${title}
      </div>

      <label>Ngăn cách:
        <select id="sep-${key}" class="sep-select">
          <option value="">0 cách</option>
          <option value=" ">Dấu cách ( )</option>
          <option value=".">Dấu chấm (.)</option>
          <option value=",">Dấu phẩy (,)</option>
          <option value="+">Dấu cộng (+)</option>
          <option value="-">Gạch ngang (-)</option>
        </select>
      </label>

      <br>

      <button onclick="generateGeneric('${key}')">
        Đổi ngẫu nhiên
      </button>

      <button id="btn-${id}" onclick="copyText('${id}')">
        Copy
      </button>

      <br>

      <textarea id="${id}"></textarea>

    </div>
  `;

  // tạo nút menu ngang
  const btn = document.createElement("button");

  btn.innerText = key;

  btn.onclick = () => {

    document.getElementById("selectMenu").value = key;

    document.querySelectorAll("#menuTabs button")
      .forEach(b => b.classList.remove("active-tab"));

    btn.classList.add("active-tab");

    showSection();
  };

  menuTabs.appendChild(btn);
}

  /* ================== HÀM DÙNG CHUNG ================== */
  function chonNgauNhien(arr, soLuong) {
    const copy = [...arr], result = [];
    while (result.length < soLuong && copy.length > 0) {
      const index = Math.floor(Math.random() * copy.length);
      result.push(copy.splice(index, 1)[0]);
    }
    return result;
  }
const lastResultMap = {};
	function generateGeneric(key) {
	  const { id, groups, format } = datasets[key];
	  const separator = document.getElementById("sep-" + key).value;
	  const startStr = document.getElementById("startKy").value;
	  const start = parseInt(startStr);
	  const total = parseInt(document.getElementById("soKy").value);
	  const len = startStr.length;
	
	  let output = [];
	  let lastJian = null;
	  for (let i = 0; i < total; i++) {
	    let kyNum = start + (total - 1 - i);
	    let ky = String(kyNum).padStart(len, "0");
	
		let picks;
		if (key === "精选24码") {
		  // trả về mảng số
		  picks = groups.flatMap(g => {
		    let picked = chonNgauNhien(g.data, g.count);
		    if (g.sort) picked.sort((a, b) => a - b);
		    return picked; // ❌ KHÔNG join ở đây
		  });
		  output.push(format(ky, picks, separator)); // truyền thêm separator
		} else {
	      // các mục khác giữ nguyên
		let currentKey;

		do {

		  picks = groups.map(g => {

			let picked = chonNgauNhien(
			  g.data,
			  g.count
			);

			if (g.sort) {
			  picked.sort((a, b) => a - b);
			}

			return picked.join(separator);

		  });

		  currentKey = JSON.stringify(picks);

		} while (currentKey === lastResultMap[key]);

		lastResultMap[key] = currentKey;

		output.push(format(ky, ...picks));
	    }
	  }
	  document.getElementById(id).value = output.join("").trim();
	}

  function copyText(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.select();
    el.setSelectionRange(0, 99999);
    document.execCommand("copy");

    const btn = document.getElementById("btn-" + id);
    if (btn) {
      btn.innerHTML = "✅ Đã copy";
      btn.style.backgroundColor = "#c8f7c5";
      btn.style.color = "#333";
      setTimeout(() => {
        btn.innerHTML = "Copy";
        btn.style.backgroundColor = "";
        btn.style.color = "";
      }, 800);
    }
  }

function showSection() {
  const selected = document.getElementById("selectMenu").value;

  document.querySelectorAll(".section")
    .forEach(div => div.classList.remove("active"));

  if (selected && document.getElementById("section-"+selected)) {
    document.getElementById("section-"+selected)
      .classList.add("active");
  }

  // active tab
  document.querySelectorAll("#menuTabs button")
    .forEach(btn => {
      btn.classList.toggle(
        "active-tab",
        btn.innerText === selected
      );
    });
}
function toggleMenu() {

  const wrapper =
    document.getElementById("menuTabsWrapper");

  if (wrapper.style.display === "none") {

    wrapper.style.display = "block";

  } else {

    wrapper.style.display = "none";
  }
}
  function normalize(str) {
  return str.toLowerCase().replace(/\s+/g, "");
}

function searchTool() {

  const keyword =
    normalize(
      document.getElementById("searchBox").value
    );

  const wrapper =
    document.getElementById("menuTabsWrapper");

  const buttons =
    document.querySelectorAll("#menuTabs button");

  // nếu có nhập thì tự mở menu
  if (keyword !== "") {

    wrapper.style.display = "block";

  } else {

    wrapper.style.display = "none";
  }

  let found = false;

  buttons.forEach(btn => {

    const text =
      normalize(btn.innerText);

    if (text.includes(keyword)) {

      btn.style.display = "inline-block";

      found = true;

    } else {

      btn.style.display = "none";
    }
  });

  // nếu không có kết quả
  if (!found && keyword !== "") {

    wrapper.style.display = "none";
  }
}

function handleEnter(e) {

  if (e.key === "Enter") {

    const key =
      document.getElementById("selectMenu").value;

    if (datasets[key]) {

      generateGeneric(key);
    }
  }
}
showSection();

const menuTabsEl = document.getElementById("menuTabs");

menuTabsEl.addEventListener("wheel", (e) => {

  e.preventDefault();

  menuTabsEl.scrollBy({
    left: e.deltaY * 2,
    behavior: "smooth"
  });

});
